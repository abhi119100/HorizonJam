name: Contract and browser checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  contracts:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-ci.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: python -m pip install -r requirements-ci.lock
      - run: python -m pip check
      - run: npm ci
      - run: python -m unittest discover -s tests -t . -v
      - run: python -m playwright install chromium
      - run: python eval/browser_runtime_check.py --output eval/readiness/ci-browser.json
      - run: npm exec --offline next -- build ./nextjs-frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: eval/readiness/ci-browser.json
